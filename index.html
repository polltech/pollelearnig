<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolleLearning - Free Udemy Courses</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-container {
            margin-bottom: 20px;
        }
        #search-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .course-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .course-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .course-card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .course-card-content h3 {
            font-size: 18px;
            margin: 0 0 10px;
        }
        .course-card-content p {
            font-size: 14px;
            color: #555;
            flex-grow: 1;
        }
        .enroll-button {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            margin-top: 15px;
        }
        .course-card-footer {
            padding: 10px 15px;
            background-color: #f4f7f6;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>PolleLearning</h1>
            <p>Your source for free Udemy courses</p>
        </header>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for courses...">
        </div>

        <div class="course-grid" id="course-grid">
            <!-- Courses will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const courseGrid = document.getElementById('course-grid');
            const searchInput = document.getElementById('search-input');
            let courses = [];

            fetch('courses.json')
                .then(response => response.json())
                .then(data => {
                    courses = data;
                    displayCourses(courses);
                })
                .catch(error => {
                    console.error('Error fetching courses:', error);
                    courseGrid.innerHTML = '<p>Could not load courses. Please try again later.</p>';
                });

            function displayCourses(coursesToDisplay) {
                courseGrid.innerHTML = '';
                coursesToDisplay.forEach(course => {
                    const courseCard = document.createElement('div');
                    courseCard.className = 'course-card';

                    courseCard.innerHTML = `
                        <img src="${course.thumbnail}" alt="${course.title}">
                        <div class="course-card-content">
                            <h3>${course.title}</h3>
                            <p>${course.description}</p>
                            <a href="${course.enroll_url}" target="_blank" class="enroll-button">Enroll Now</a>
                        </div>
                        <div class="course-card-footer">
                            <span>Expires on: ${course.expiration}</span>
                        </div>
                    `;
                    courseGrid.appendChild(courseCard);
                });
            }

            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.toLowerCase();
                const filteredCourses = courses.filter(course => {
                    return course.title.toLowerCase().includes(searchTerm) ||
                           course.description.toLowerCase().includes(searchTerm);
                });
                displayCourses(filteredCourses);
            });
        });
    </script>
</body>
</html>
